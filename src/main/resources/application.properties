# show generated SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# force creation of tables on startup (development only)
spring.jpa.hibernate.ddl-auto=create

# ensure Hibernate prints schema generation messages and SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG

# enable the H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# explicit datasource for in-memory DB and keep it alive while the JVM runs
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.platform=h2
